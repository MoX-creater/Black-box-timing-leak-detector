services:
  - type: web
    name: black-box-timing-leak-detector
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: node src/launcher.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
